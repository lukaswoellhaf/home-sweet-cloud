apiVersion: v1
kind: Secret
metadata:
  name: provider-api-keys
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Chart.Name }}
    managed-by: helm
type: Opaque
stringData:
  keys: "{{ .Values.apiKeys.openaiApiKey }};{{ .Values.apiKeys.mistralApiKey }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: web-search-api-keys
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Chart.Name }}
    managed-by: helm
type: Opaque
stringData:
  brave-search-api-key: "{{ .Values.apiKeys.braveSearchApiKey }}"
