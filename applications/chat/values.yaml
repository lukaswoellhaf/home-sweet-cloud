namespace:
  name: chat
  create: true

apiKeys:
  # Will be overridden in workflow with actual secrets
  anthropicApiKey: ""

open-webui:
  namespaceOverride: chat

  replicaCount: 1

  # Disable Ollama (local model runner)
  ollama:
    enabled: false
  ollamaUrls: []

  # Disable Pipelines
  pipelines:
    enabled: false

  # Disable signup
  extraEnvVars:
    - name: ENABLE_SIGNUP
      value: "false"

  extraEnvFrom:
    - secretRef:
        name: ai-models-api-keys

  ingress:
    enabled: true
    class: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.middlewares: default-https-redirect@kubernetescrd
    host: chat.lukaswoellhaf.com
    tls: true
    existingSecret: chat-lukaswoellhaf-com-tls

  persistence:
    enabled: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce

  websocket:
    enabled: true
    manager: redis
    redis:
      enabled: true
