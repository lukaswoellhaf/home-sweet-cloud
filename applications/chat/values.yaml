namespace:
  name: chat
  create: true

apiKeys:
  # Will be overridden in workflow with actual secrets
  openaiApiKey: ""
  mistralApiKey: ""
  braveSearchApiKey: ""

open-webui:
  namespaceOverride: chat

  replicaCount: 1

  # Disable Ollama (local model runner)
  ollama:
    enabled: false
  ollamaUrls: []

  # OpenAI as primary, Mistral as secondary — keys injected from combined K8s secret
  enableOpenaiApi: true
  openaiBaseApiUrls:
    - "https://api.openai.com/v1"
    - "https://api.mistral.ai/v1"
  openaiApiKeysExistingSecret: "provider-api-keys"
  openaiApiKeysExistingSecretKey: "keys"

  # Disable Pipelines
  pipelines:
    enabled: false

  # Disable signup
  extraEnvVars:
    - name: ENABLE_SIGNUP
      value: "false"
    # Web search via Brave Search API (brave_llm_context)
    - name: ENABLE_WEB_SEARCH
      value: "true"
    - name: WEB_SEARCH_ENGINE
      value: "brave_llm_context"
    - name: BRAVE_SEARCH_API_KEY
      valueFrom:
        secretKeyRef:
          name: web-search-api-keys
          key: brave-search-api-key
    - name: WEB_SEARCH_CONCURRENT_REQUESTS
      value: "1"
    - name: WEB_SEARCH_RESULT_COUNT
      value: "3"
    # Use OpenAI for embeddings (fast API vs slow local CPU)
    - name: RAG_EMBEDDING_ENGINE
      value: "openai"
    - name: RAG_EMBEDDING_MODEL
      value: "text-embedding-3-small"
    # v0.9.6 web search retrieval fix (github.com/open-webui/open-webui/issues/25585)
    - name: ENABLE_RETRIEVAL_UNSCOPED_COLLECTIONS
      value: "true"
    # Native function calling (required for web search in v0.9.6+)
    - name: DEFAULT_MODEL_PARAMS
      value: '{"function_calling":"native"}'
    # Security & privacy hardening
    - name: WEBUI_SESSION_COOKIE_SECURE
      value: "true"
    - name: CORS_ALLOW_ORIGIN
      value: "https://chat.lukaswoellhaf.com"
    - name: ENABLE_COMMUNITY_SHARING
      value: "false"

  ingress:
    enabled: true
    class: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    host: chat.lukaswoellhaf.com
    tls: true
    existingSecret: chat-lukaswoellhaf-com-tls

  persistence:
    enabled: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce

  websocket:
    enabled: true
    manager: redis
    redis:
      enabled: true
