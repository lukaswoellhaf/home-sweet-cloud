namespace:
  name: chat
  create: true

apiKeys:
  # Will be overridden in workflow with actual secrets
  openaiApiKey: ""
  mistralApiKey: ""

open-webui:
  namespaceOverride: chat

  replicaCount: 1

  # Disable Ollama (local model runner)
  ollama:
    enabled: false
  ollamaUrls: []

  # OpenAI as primary, Mistral as secondary — keys injected from combined K8s secret
  enableOpenaiApi: true
  openaiBaseApiUrls:
    - "https://api.openai.com/v1"
    - "https://api.mistral.ai/v1"
  openaiApiKeysExistingSecret: "provider-api-keys"
  openaiApiKeysExistingSecretKey: "keys"

  # Disable Pipelines
  pipelines:
    enabled: false

  # Disable signup
  extraEnvVars:
    - name: ENABLE_SIGNUP
      value: "false"
    # Web search via DDGS metasearch engine
    - name: ENABLE_WEB_SEARCH
      value: "true"
    - name: WEB_SEARCH_ENGINE
      value: "ddgs"
    - name: DDGS_BACKEND
      value: "bing"
    - name: WEB_SEARCH_RESULT_COUNT
      value: "5"
    # Security & privacy hardening
    - name: WEBUI_SESSION_COOKIE_SECURE
      value: "true"
    - name: CORS_ALLOW_ORIGIN
      value: "https://chat.lukaswoellhaf.com"
    - name: ENABLE_COMMUNITY_SHARING
      value: "false"

  ingress:
    enabled: true
    class: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    host: chat.lukaswoellhaf.com
    tls: true
    existingSecret: chat-lukaswoellhaf-com-tls

  persistence:
    enabled: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce

  websocket:
    enabled: true
    manager: redis
    redis:
      enabled: true
