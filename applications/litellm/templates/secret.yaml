apiVersion: v1
kind: Secret
metadata:
  name: litellm-api-keys
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Chart.Name }}
    managed-by: helm
type: Opaque
stringData:
  OPENAI_API_KEY: "{{ .Values.apiKeys.openaiApiKey }}"
  MISTRAL_API_KEY: "{{ .Values.apiKeys.mistralApiKey }}"
  DEEPSEEK_API_KEY: "{{ .Values.apiKeys.deepseekApiKey }}"
  MOONSHOT_API_KEY: "{{ .Values.apiKeys.moonshotApiKey }}"
  LITELLM_MASTER_KEY: "{{ .Values.litellmMasterKey }}"
