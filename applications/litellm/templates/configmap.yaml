apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Chart.Name }}
    managed-by: helm
data:
  config.yaml: |
    model_list:
    {{- toYaml .Values.modelList | nindent 4 }}

    litellm_settings:
      drop_params: true
      route_all_chat_openai_to_responses: true
      callbacks: ["prometheus", "/app/hooks/force_moonshot_params.force_moonshot_params"]

    router_settings:
      num_retries: 2
      allowed_fails: 3
      cooldown_time: 30
