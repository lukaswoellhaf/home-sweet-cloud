apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-hooks
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Chart.Name }}
    managed-by: helm
data:
  force_moonshot_params.py: |
    """
    Pre-call hook that forces Kimi's fixed parameter values.
    Kimi K3 and K2.6 reject any deviation from: temperature=1.0, top_p=0.95,
    n=1, presence_penalty=0, frequency_penalty=0.
    Required because VS Code Copilot sends its own values which LiteLLM
    cannot override via litellm_params (those are defaults, not overrides).
    """
    from litellm.integrations.custom_logger import CustomLogger


    class ForceMoonshotParams(CustomLogger):
        async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
            model = str(data.get("model", ""))
            if "moonshot" in model or model in ("kimi-k3", "kimi-k2.6"):
                data["temperature"] = 1.0
                data["top_p"] = 0.95
                data["n"] = 1
                data["presence_penalty"] = 0
                data["frequency_penalty"] = 0
            return data


    force_moonshot_params = ForceMoonshotParams()
