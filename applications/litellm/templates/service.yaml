apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Chart.Name }}
    component: proxy
    managed-by: helm
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Chart.Name }}
    component: proxy
