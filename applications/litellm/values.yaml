# LiteLLM proxy configuration

# Namespace
namespace:
  name: litellm
  create: true

# Image
image:
  repository: ghcr.io/berriai/litellm-non_root
  pullPolicy: IfNotPresent
  tag: "v1.91.1"

replicaCount: 1

# API keys (injected via CI/CD secrets)
apiKeys:
  openaiApiKey: ""
  mistralApiKey: ""
  deepseekApiKey: ""
  moonshotApiKey: ""

# LiteLLM master key (injected via CI/CD secrets)
litellmMasterKey: ""

# Models and provers to expose through the proxy
modelList:
  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
      api_key: os.environ/OPENAI_API_KEY
  - model_name: "mistral/*"
    litellm_params:
      model: "mistral/*"
      api_key: os.environ/MISTRAL_API_KEY
  - model_name: "deepseek/*"
    litellm_params:
      model: "deepseek/*"
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: "moonshot/*"
    litellm_params:
      model: "moonshot/*"
      api_key: os.environ/MOONSHOT_API_KEY
  - model_name: "kimi-k3"
    litellm_params:
      model: "moonshot/kimi-k3"
      api_key: os.environ/MOONSHOT_API_KEY

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: llm.lukaswoellhaf.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: llm-lukaswoellhaf-com-tls
      hosts:
        - llm.lukaswoellhaf.com

# Prometheus ServiceMonitor
serviceMonitor:
  enabled: true
  interval: 60s

# Resource limits
resources:
  limits:
    cpu: 500m
    # No memory limit — startup spikes above 1Gi
  requests:
    cpu: 100m
    memory: 384Mi

# Health checks
livenessProbe:
  httpGet:
    path: /health/liveliness
    port: 4000
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/readiness
    port: 4000
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534    # litellm-non_root image uses 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false  # Needs to write SQLite DB
