{{- if .Values.smokeTest.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.smokeTest.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-test
  namespace: {{ .Values.smokeTest.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-test
  template:
    metadata:
      labels:
        app: smoke-test
    spec:
      containers:
        - name: http-echo
          image: {{ .Values.smokeTest.image.repository }}:{{ .Values.smokeTest.image.tag }}
          imagePullPolicy: {{ .Values.smokeTest.image.pullPolicy }}
          args:
            - -listen
            - :{{ .Values.smokeTest.service.targetPort }}
            - -text
            - {{ .Values.smokeTest.responseText | quote }}
          ports:
            - containerPort: {{ .Values.smokeTest.service.targetPort }}
              name: http
          resources:
            {{- toYaml .Values.smokeTest.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-test
  namespace: {{ .Values.smokeTest.namespace }}
spec:
  selector:
    app: smoke-test
  ports:
    - name: http
      port: {{ .Values.smokeTest.service.port }}
      targetPort: {{ .Values.smokeTest.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smoke-test
  namespace: {{ .Values.smokeTest.namespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - secretName: {{ .Values.smokeTest.tlsSecretName }}
      hosts:
        - {{ .Values.smokeTest.host }}
  rules:
    - host: {{ .Values.smokeTest.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smoke-test
                port:
                  number: {{ .Values.smokeTest.service.port }}
{{- end }}
