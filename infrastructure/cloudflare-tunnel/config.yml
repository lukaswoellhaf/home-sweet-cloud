# Cloudflare Tunnel Configuration

# Tunnel UUID is rendered during workflow deployment from GitHub secret CLOUDFLARED_TUNNEL_UUID
tunnel: homesweetcloud
credentials-file: /root/.cloudflared/{{TUNNEL_UUID}}.json

# Run the tunnel service with debug logging if needed
# loglevel: debug

# Ingress routes
ingress:
  - hostname: lukaswoellhaf.com
    service: http://localhost:80
  - hostname: www.lukaswoellhaf.com
    service: http://localhost:80
  - hostname: code.lukaswoellhaf.com
    service: http://localhost:80
  - hostname: www.code.lukaswoellhaf.com
    service: http://localhost:80
  - hostname: grafana.lukaswoellhaf.com
    service: http://localhost:80
  - hostname: www.grafana.lukaswoellhaf.com
    service: http://localhost:80
  - hostname: chat.lukaswoellhaf.com
    service: http://localhost:80
  - hostname: www.chat.lukaswoellhaf.com
    service: http://localhost:80
  - hostname: llm.lukaswoellhaf.com
    service: http://localhost:80
  
  # Catch-all: no other routes match
  - service: http_status:404
